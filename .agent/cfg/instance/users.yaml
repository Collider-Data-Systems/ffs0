schema_version: "1.0.0"
updated_at: "2026-03-24"
owner: "FFS0_Factory"
description: "Defines the formal identity-object access schema and authentication profiles. This file does not contain actual user data."

# Ownership model — four roles used across GitHub labels, PRG tracking, and graph governance.
# Maps to: role:user | role:admin | role:agent | role:group labels in GitHub Issues/PRs.
ownership_roles:
  - role: user
    github_label: "role:user"
    description: "Human actor with authenticated workspace access. Owns their own data scope."
    can_approve_promotions: false
    can_merge_to_main: false

  - role: admin
    github_label: "role:admin"
    description: "Governed administrator. Sam (AuthUser) holds this role. Owns main branch and all category scopes."
    can_approve_promotions: true
    can_merge_to_main: true

  - role: agent
    github_label: "role:agent"
    description: "AI agent executing delegated tasks. Scoped to an instance branch. May propose but not approve promotions."
    can_approve_promotions: false
    can_merge_to_main: false

  - role: group
    github_label: "role:group"
    description: "Team or group ownership for shared work items. Governs multi-agent or multi-user scopes."
    can_approve_promotions: false
    can_merge_to_main: false

identity_objects:
  - id: superadmin
    ontology_ref: OBJ03
    type_id: superadmin
    ownership_role: admin
    description: "Transitive ownership across all active categories."
    source_morphisms:
      - OWNS
      - CAN_HYDRATE
      - PRE_FLIGHT_CONFIG
      - CAN_SCHEDULE
      - CAN_FEDERATE
    structure_capabilities:
      - ontology_ref: OBJ05
        action: "Can create NodeContainers and govern all reachable descendants."

  - id: collider_admin
    ontology_ref: OBJ02
    type_id: collider_admin
    ownership_role: admin
    description: "Governed administrator for assigned categories and containers."
    source_morphisms:
      - OWNS
      - CAN_HYDRATE
      - PRE_FLIGHT_CONFIG
    structure_capabilities:
      - ontology_ref: OBJ05
        action: "Can create NodeContainers within assigned governance scope."

  - id: user
    ontology_ref: OBJ01
    type_id: user
    ownership_role: user
    description: "Authenticated actor with owned-workspace access."
    source_morphisms:
      - OWNS
      - CAN_HYDRATE
    structure_capabilities: []

  - id: agent
    ontology_ref: OBJ24
    type_id: agent_session
    ownership_role: agent
    description: "AI agent instance. Scoped to one kernel leaf (instance branch). Executes delegated PRG phases."
    source_morphisms:
      - CAN_HYDRATE
    structure_capabilities:
      - ontology_ref: OBJ25
        action: "Can ADD and MUTATE prg_task nodes within delegated scope."
      - ontology_ref: OBJ28
        action: "Can ADD channel_message nodes for structural PRG decisions only (deprecated for routing — Wave 4). Use delegation_task for all inter-agent coordination."
    known_agents:
      - urn: urn:moos:agent:claude-code
        ide: "Claude Desktop"
        branch_prefix: "agent/claude-code"
        role: lead
      - urn: urn:moos:agent:vscode-ai
        ide: "VS Code (Sonnet 4.6)"
        branch_prefix: "agent/vscode-ai"
        role: execution
      - urn: urn:moos:agent:antigraviti
        ide: "Antigraviti (Gemini 3.1 Pro)"
        branch_prefix: "agent/antigraviti"
        role: testing

  - id: group
    ontology_ref: OBJ05
    type_id: node_container
    ownership_role: group
    description: "Group/team ownership scope. A NodeContainer that owns a set of agents, users, or work items."
    source_morphisms:
      - OWNS
    structure_capabilities:
      - ontology_ref: OBJ05
        action: "Can aggregate multiple agents or users under a shared governance scope."

governance_notes:
  - "Identity is modeled as objects and source morphisms, not as application permission labels."
  - "Application is a projection surface, not an ontological access unit."
  - "NodeContainer creation semantics reference OBJ05."
  - "An agent may propose promotions but not approve them — Sam (admin) holds approval authority."
  - "Group ownership maps to GitHub team mentions or multi-owner issue labels."

# Authentication profiles
auth_profiles:
  dataserver:
    method: username_password
    jwt_algorithm: HS256
    description: "Direct auth for DataServer API"
  extension:
    method: firebase_google_signin
    description: "Planned for Chrome extension sign-in"
