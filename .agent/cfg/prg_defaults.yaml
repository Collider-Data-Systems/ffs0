schema_version: "1.0.0"
updated_at: "2026-03-24"
owner: "FFS0_Factory"
description: "Default PRG scope, phase lifecycle states, and harness patterns for program tracking."

# PRG scope categories — maps to Collider categorical space
scope_categories:
  - id: gate
    description: "Locked sequential gate PRG. Cannot start until previous gate completes."
    harness_pattern: fixed-plan-sequential
    example_urns:
      - urn:moos:prg:034-naturality-harness
      - urn:moos:prg:035-ptp-portbinding
      - urn:moos:prg:036-cloverleaf-topology
      - urn:moos:prg:037-inspect-run-separation

  - id: operational
    description: "Adaptive PRG. Phases can be reordered, added, or removed at runtime."
    harness_pattern: dynamic-plan-adaptive
    example_urns:
      - urn:moos:prg:001-calendar-hydration
      - urn:moos:prg:038-moos-media
      - urn:moos:prg:039-session-identity
      - urn:moos:prg:040-the-bridge

  - id: meta
    description: "Session meta-program. Never completes. All other PRGs wire to this."
    harness_pattern: fixed-plan-sequential
    example_urns:
      - urn:moos:prg:000-session-meta

  - id: sub
    description: "Child PRG wired to a parent via parent.out → sub.in. Narrow context isolation."
    harness_pattern: dynamic-plan-adaptive

# Phase lifecycle states (ordered)
phase_lifecycle:
  states:
    - planned
    - delegated
    - active
    - in_progress
    - completed
    - blocked

  terminal_states:
    - completed
    - blocked

  default_initial_state: planned

  transitions:
    planned:     [delegated, active]
    delegated:   [active, blocked]
    active:      [in_progress, blocked]
    in_progress: [completed, blocked]
    blocked:     [active]

# Default phase schema — every PRG phase must declare these fields
phase_defaults:
  status: planned
  validation_condition: ""    # what must be true for this phase to be complete
  gate_output: ""             # what downstream PRGs depend on (gate PRGs only)
  owner_role: user            # default role: user | admin | agent | group
  agent_id: ""                # executing agent URN, e.g. urn:moos:agent:vscode-ai

# Harness patterns
harness_patterns:
  fixed-plan-sequential:
    description: "Phases execute in declared order. Gate output checked before next phase starts."
    allows_phase_reorder: false
    allows_phase_add: false
    allows_phase_remove: false

  dynamic-plan-adaptive:
    description: "Phases can be reordered, added, or removed at runtime via MUTATE morphism."
    allows_phase_reorder: true
    allows_phase_add: true
    allows_phase_remove: true

# Gate dependency model
# A gate PRG may only begin execution when the previous gate's gate_output is satisfied.
gate_sequence:
  - prg: "034"
    title: "Naturality Harness"
    gate_number: 1
    blocks: ["035"]
  - prg: "035"
    title: "PTP PortBinding"
    gate_number: 2
    blocks: ["036"]
  - prg: "036"
    title: "Cloverleaf Topology"
    gate_number: 3
    blocks: ["037"]
  - prg: "037"
    title: "Inspect/Run Separation"
    gate_number: 4
    blocks: []

# PRG URN convention
urn_convention:
  pattern: "urn:moos:prg:{NNN}-{slug}"
  examples:
    - "urn:moos:prg:000-session-meta"
    - "urn:moos:prg:034-naturality-harness"
    - "urn:moos:prg:039-session-identity"
  slug_rules:
    - "lowercase"
    - "hyphen-separated"
    - "no spaces or underscores"

governance_notes:
  - "PRG nodes live in the kernel graph as prg_task objects (OBJ25)."
  - "Phase status mutations are MUTATE morphisms on the prg_task node payload."
  - "Gate PRG phases must have an explicit gate_output field before downstream PRGs can be delegated."
  - "An agent may PROPOSE a phase promotion. Sam (AuthUser) approves."
