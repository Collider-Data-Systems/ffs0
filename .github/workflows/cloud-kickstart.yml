name: Cloud Kickstart

on:
  workflow_dispatch:
    inputs:
      create_seed_issue:
        description: "Create a starter tracking issue"
        required: true
        type: boolean
        default: true
  issues:
    types: [opened, edited]
  pull_request:
    types: [opened, edited, reopened, synchronize]

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  bootstrap-labels:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Ensure default labels
        uses: actions/github-script@v7
        with:
          script: |
            const labels = [
              ["kind:prg", "0e8a16", "PRG-scoped work item"],
              ["kind:agent-task", "5319e7", "Agent-executable task"],
              ["kind:shipping", "1d76db", "Shipping/go-live item"],
              ["role:user", "bfd4f2", "User-owned or user-requested"],
              ["role:admin", "d4c5f9", "Admin-owned action"],
              ["role:agent", "7057ff", "Agent-owned or agent-executed"],
              ["role:group", "c2e0c6", "Group/team ownership"],
              ["status:needs-triage", "fbca04", "Needs triage"],
              ["status:blocked", "b60205", "Blocked by dependency"],
              ["area:factory", "0052cc", "Factory orchestrator scope"],
              ["area:ontology", "006b75", "Ontology/schema scope"]
            ];
            for (const [name, color, description] of labels) {
              try {
                await github.rest.issues.createLabel({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  name,
                  color,
                  description
                });
              } catch (error) {
                if (error.status === 422) {
                  core.info(`Label already exists: ${name}`);
                } else {
                  throw error;
                }
              }
            }

      - name: Create seed issue
        if: inputs.create_seed_issue == true
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: "Kickstart: PRG and agent mapping backlog",
              labels: ["kind:shipping", "status:needs-triage"],
              body: [
                "Use this issue to bootstrap cloud tracking for this repository.",
                "",
                "Checklist:",
                "- [ ] Define PRG scope and phase defaults",
                "- [ ] Define agent/user/admin/group ownership model",
                "- [ ] Add or verify branch role policy",
                "- [ ] Link first execution PR"
              ].join("\n")
            });

  triage-issue:
    if: github.event_name == 'issues'
    runs-on: ubuntu-latest
    steps:
      - name: Apply triage labels from issue content
        uses: actions/github-script@v7
        with:
          script: |
            const issue = context.payload.issue;
            const body = issue.body || "";
            const labels = ["status:needs-triage"];
            if (/\bPRG\d{3}\b/i.test(issue.title) || /\bPRG\d{3}\b/i.test(body)) labels.push("kind:prg");
            if (/\bAgent\s*ID\b/i.test(body) || /\bagent[_ -]?id\b/i.test(body)) labels.push("kind:agent-task");
            if (/\b(admin|group|team)\b/i.test(body)) labels.push("role:group");

            await github.rest.issues.addLabels({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issue.number,
              labels
            });

  link-first-execution-pr:
    # Fires on PRs, posts a comment linking the PR to the open kickstart issue.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Link execution PR to kickstart issue
        uses: actions/github-script@v7
        with:
          script: |
            const pr = context.payload.pull_request;

            // Title of the seed kickstart issue to link against
            const KICKSTART_TITLE = "Kickstart: PRG and agent mapping backlog";

            // Find kickstart issue — search by exact title
            const issues = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: "open",
              per_page: 50
            });
            const kickstart = (issues.data || []).find(i =>
              i.title === KICKSTART_TITLE
            );
            if (!kickstart) {
              core.info("No open kickstart issue found — skipping.");
              return;
            }

            // Only link once: skip if a comment already references this exact PR number.
            // Use a regex that matches #<number> not followed by another digit to avoid
            // false positives (e.g., #12 matching inside #123).
            const prRef = new RegExp(`#${pr.number}(?![0-9])`);
            const comments = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: kickstart.number,
              per_page: 100
            });
            const alreadyLinked = (comments.data || []).some(c => c.body && prRef.test(c.body));
            if (alreadyLinked) {
              core.info(`PR #${pr.number} already linked to kickstart issue.`);
              return;
            }

            // Post the link comment
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: kickstart.number,
              body: [
                `🔗 **First execution PR linked:** #${pr.number} — [${pr.title}](${pr.html_url})`,
                "",
                `Branch: \`${pr.head.ref}\``,
                `Author: @${pr.user.login}`,
                "",
                "This PR advances the kickstart checklist. Merging this PR completes the _Link first execution PR_ item."
              ].join("\n")
            });
            core.info(`Linked PR #${pr.number} to kickstart issue #${kickstart.number}.`);
